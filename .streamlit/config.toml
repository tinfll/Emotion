# Used when Streamlit runs without explicit CLI flags (e.g. Streamlit Cloud).
# The Dockerfile passes --server.port/address/headless, which take precedence.
[server]
headless = true
address = "0.0.0.0"
port = 8501
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 10

[browser]
gatherUsageStats = false

[theme]
base = "light"
